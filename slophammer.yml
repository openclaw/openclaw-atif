typescript:
  coverage:
    threshold: 85
  complexity:
    max: 8
  dry:
    max_findings: 0
    paths:
      - src
    exclude:
      - "**/*.test.ts"
      - "dist/**"
      - "node_modules/**"
    copied_blocks:
      enabled: true
      min_tokens: 100
  mutation:
    enabled: true
    targets:
      - src/atif/identity.ts
      - src/stable-json.ts
  dependency_boundaries:
    - from: src
      allow:
        - src
