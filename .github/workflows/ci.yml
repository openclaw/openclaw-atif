name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  NPM_CONFIG_REGISTRY: https://registry.npmjs.org/

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  migration-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.18.0"
          cache: npm
      - run: npm install --global npm@11.19.0 --ignore-scripts
      - run: npm ci
      - name: Install pinned migration dependency
        run: npm install --prefix "$RUNNER_TEMP/migration-openclaw" --ignore-scripts --omit=dev openclaw@2026.9.5
      - name: Verify real migration preserves original state
        run: node scripts/smoke-migration.mjs "$RUNNER_TEMP/migration-openclaw"
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.18.0"
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: npm install --global npm@11.19.0 --ignore-scripts
      - run: npm ci
      - run: npm run check
      - run: npm run mutate
      - run: npm run slophammer
      - run: npm run validate:harbor
      - name: Pack tested build
        run: node scripts/pack-release.mjs "$RUNNER_TEMP/package"
      - run: npm run smoke:cli
