name: Publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: Package version to validate at the selected ref
        required: true
        type: string
      dry_run:
        description: Validate only; manual dispatch cannot publish
        required: true
        default: true
        type: boolean
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

env:
  NPM_CONFIG_REGISTRY: https://registry.npmjs.org/

concurrency:
  group: openclaw-atif-npm-publish
  cancel-in-progress: false
  queue: max

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.18.0"
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Set npm trusted publishing version
        run: npm install --global npm@11.19.0 --ignore-scripts
      - name: Verify release
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_TAG: ${{ github.event.release.tag_name || format('v{0}', inputs.version) }}
          EVENT_NAME: ${{ github.event_name }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$DRY_RUN" != "true" ]]; then
            echo "Manual dispatch only supports dry_run: true" >&2
            exit 1
          fi
          PACKAGE_VERSION="$(node -p 'require("./package.json").version')"

          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ || "$RELEASE_TAG" != "v$PACKAGE_VERSION" ]]; then
            echo "Release tag $RELEASE_TAG does not match package version $PACKAGE_VERSION" >&2
            exit 1
          fi

          git fetch origin "$DEFAULT_BRANCH"
          if ! git merge-base --is-ancestor HEAD "origin/$DEFAULT_BRANCH"; then
            echo "The release commit is not on $DEFAULT_BRANCH" >&2
            exit 1
          fi
      - run: npm ci
      - run: npm run check
      - run: npm run mutate
      - run: npm run slophammer
      - run: npm run validate:harbor
      - name: Pack tested build
        run: node scripts/pack-release.mjs "$RUNNER_TEMP/package"
      - run: npm run smoke:cli
      - name: Install pinned migration dependency
        run: npm install --prefix "$RUNNER_TEMP/migration-openclaw" --ignore-scripts --omit=dev openclaw@2026.9.5
      - name: Verify real migration preserves original state
        run: node scripts/smoke-migration.mjs "$RUNNER_TEMP/migration-openclaw"
      - name: Check registry artifact
        if: github.event_name == 'release'
        id: registry
        run: |
          set -euo pipefail
          PACKAGE_NAME="$(node -p 'require("./package.json").name')"
          PACKAGE_VERSION="$(node -p 'require("./package.json").version')"
          PACKAGE_SPEC="$PACKAGE_NAME@$PACKAGE_VERSION"
          if npm view "$PACKAGE_SPEC" --prefer-online --json >"$RUNNER_TEMP/npm-package.json" 2>"$RUNNER_TEMP/npm-view-error"; then
            node scripts/check-release-package.mjs "$RUNNER_TEMP/npm-package.json"
            echo "already_published=true" >>"$GITHUB_OUTPUT"
          elif grep -q "E404" "$RUNNER_TEMP/npm-view-error"; then
            LATEST_VERSION="$(npm view "$PACKAGE_NAME" dist-tags.latest --prefer-online)"
            node scripts/check-release-version.mjs "$PACKAGE_VERSION" "$LATEST_VERSION"
            echo "already_published=false" >>"$GITHUB_OUTPUT"
          else
            cat "$RUNNER_TEMP/npm-view-error" >&2
            exit 1
          fi
      - name: Publish package
        if: github.event_name == 'release' && steps.registry.outputs.already_published != 'true'
        run: npm publish "$PACKAGE_TARBALL" --ignore-scripts --provenance --access public
      - name: Preview tested package
        if: github.event_name == 'workflow_dispatch'
        run: npm pack "$PACKAGE_TARBALL" --dry-run --ignore-scripts --json
      - name: Verify package
        if: github.event_name == 'release'
        run: bash scripts/verify-release-package.sh
