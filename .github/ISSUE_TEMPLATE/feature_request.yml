name: Feature request
description: Propose an improvement to public bundle conversion or export workflows.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the workflow and what prevents it from working today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior and alternatives
      description: Identify any new source facts or public contract changes this requires.
    validations:
      required: true
